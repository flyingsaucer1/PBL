<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Syllabus Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.75rem;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            border: none;
            background: #e5e7eb;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #2563eb;
            color: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 0.9rem;
            outline: none;
            background: #f9fafb;
        }

        input:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            padding: 8px 16px;
            border-radius: 999px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 0.85rem;
            cursor: pointer;
            margin-left: 10px;
        }

        .status {
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .status.success {
            color: #16a34a;
        }

        .status.error {
            color: #dc2626;
        }

        .syllabus-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .syllabus-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .syllabus-subject {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #111827;
        }

        .syllabus-units {
            font-size: 0.9rem;
            color: #374151;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .books-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }

        .books-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .book-item {
            background: #f9fafb;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .book-title {
            font-weight: 600;
            color: #111827;
        }

        .book-author {
            color: #6b7280;
            font-size: 0.8rem;
        }

        .empty-state {
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-row input {
            flex: 1;
            min-width: 200px;
        }

        @media (max-width: 640px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>📚 Syllabus Management System</h1>
            <span>Manage course syllabus and reference books</span>
        </div>
        <span class="badge">Module: syllabus.c</span>
    </header>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" data-target="tab-add">Add Syllabus</button>
            <button class="tab-btn" data-target="tab-add-book">Add Book</button>
            <button class="tab-btn" data-target="tab-view">View All</button>
            <button class="tab-btn" data-target="tab-search">Search by Subject</button>
            <button class="tab-btn" data-target="tab-books">View Books</button>
        </div>

        <!-- Add Syllabus -->
        <section id="tab-add" class="section active">
            <h2 style="font-size:1.1rem;margin-bottom:10px;">➕ Add New Syllabus</h2>
            <form id="addSyllabusForm">
                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" id="syllabusSubject" required placeholder="Enter subject name">
                </div>
                <div class="form-group">
                    <label>Units/Topics *</label>
                    <textarea id="syllabusUnits" required placeholder="Enter course units and topics"></textarea>
                </div>
                <button type="submit" class="btn-primary">Add Syllabus</button>
                <button type="button" class="btn-secondary" id="clearSyllabusBtn">Clear</button>
                <div id="addSyllabusStatus" class="status"></div>
            </form>
        </section>

        <!-- Add Book -->
        <section id="tab-add-book" class="section">
            <h2 style="font-size:1.1rem;margin-bottom:10px;">📖 Add Reference Book</h2>
            <div class="form-group">
                <label>Select Subject *</label>
                <select id="bookSubjectSelect" style="width:100%;padding:8px 10px;border-radius:10px;border:1px solid #d1d5db;font-size:0.9rem;background:#f9fafb;">
                    <option value="">-- Select Subject --</option>
                </select>
            </div>
            <form id="addBookForm">
                <div class="form-group">
                    <label>Book Title *</label>
                    <input type="text" id="bookTitle" required placeholder="Enter book title">
                </div>
                <div class="form-group">
                    <label>Book Author *</label>
                    <input type="text" id="bookAuthor" required placeholder="Enter author name">
                </div>
                <button type="submit" class="btn-primary">Add Book</button>
                <button type="button" class="btn-secondary" id="clearBookBtn">Clear</button>
                <div id="addBookStatus" class="status"></div>
            </form>
        </section>

        <!-- View All Syllabus -->
        <section id="tab-view" class="section">
            <h2 style="font-size:1.1rem;margin-bottom:10px;">📋 All Syllabus</h2>
            <div id="allSyllabusContainer" class="syllabus-grid"></div>
            <div id="allSyllabusEmpty" class="empty-state" style="display:none;">
                No syllabus added yet.
            </div>
        </section>

        <!-- Search by Subject -->
        <section id="tab-search" class="section">
            <h2 style="font-size:1.1rem;margin-bottom:10px;">🔍 Search Syllabus by Subject</h2>
            <div class="form-group">
                <div class="search-row">
                    <input type="text" id="searchSubjectInput" placeholder="Enter subject name">
                    <button class="btn-primary" id="searchSubjectBtn">Search</button>
                </div>
            </div>
            <div id="searchResults" class="syllabus-grid"></div>
            <div id="searchEmpty" class="empty-state" style="display:none;">
                No syllabus found for this subject.
            </div>
        </section>

        <!-- View Books for Subject -->
        <section id="tab-books" class="section">
            <h2 style="font-size:1.1rem;margin-bottom:10px;">📖 View Reference Books</h2>
            <div class="form-group">
                <div class="search-row">
                    <input type="text" id="booksSubjectInput" placeholder="Enter subject name">
                    <button class="btn-primary" id="viewBooksBtn">View Books</button>
                </div>
            </div>
            <div id="booksResults"></div>
            <div id="booksEmpty" class="empty-state" style="display:none;">
                No books found for this subject.
            </div>
        </section>
    </div>
</div>

<script>
    const syllabusList = [];

    // Tabs
    const tabButtons = document.querySelectorAll(".tab-btn");
    const sections = document.querySelectorAll(".section");

    tabButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            const targetId = btn.getAttribute("data-target");
            tabButtons.forEach(b => b.classList.remove("active"));
            sections.forEach(sec => sec.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById(targetId).classList.add("active");

            if (targetId === "tab-view") renderAllSyllabus();
            if (targetId === "tab-add-book") updateBookSubjectSelect();
        });
    });

    // Add Syllabus
    const addSyllabusForm = document.getElementById("addSyllabusForm");
    const addSyllabusStatus = document.getElementById("addSyllabusStatus");
    const clearSyllabusBtn = document.getElementById("clearSyllabusBtn");

    addSyllabusForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const subject = document.getElementById("syllabusSubject").value.trim();
        const units = document.getElementById("syllabusUnits").value.trim();

        if (!subject || !units) {
            addSyllabusStatus.textContent = "Please fill all fields.";
            addSyllabusStatus.className = "status error";
            return;
        }

        syllabusList.push({ subject, units, books: [] });
        addSyllabusStatus.textContent = "✅ Syllabus added successfully!";
        addSyllabusStatus.className = "status success";
        addSyllabusForm.reset();
    });

    clearSyllabusBtn.addEventListener("click", () => {
        addSyllabusForm.reset();
        addSyllabusStatus.textContent = "";
    });

    // Update Book Subject Dropdown
    function updateBookSubjectSelect() {
        const select = document.getElementById("bookSubjectSelect");
        select.innerHTML = '<option value="">-- Select Subject --</option>';
        syllabusList.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.subject;
            opt.textContent = s.subject;
            select.appendChild(opt);
        });
    }

    // Add Book
    const addBookForm = document.getElementById("addBookForm");
    const addBookStatus = document.getElementById("addBookStatus");
    const clearBookBtn = document.getElementById("clearBookBtn");

    addBookForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const subject = document.getElementById("bookSubjectSelect").value;
        const title = document.getElementById("bookTitle").value.trim();
        const author = document.getElementById("bookAuthor").value.trim();

        if (!subject) {
            addBookStatus.textContent = "Please select a subject.";
            addBookStatus.className = "status error";
            return;
        }

        if (!title || !author) {
            addBookStatus.textContent = "Please fill all fields.";
            addBookStatus.className = "status error";
            return;
        }

        const syllabus = syllabusList.find(s => s.subject.toLowerCase() === subject.toLowerCase());
        if (syllabus) {
            syllabus.books.push({ title, author });
            addBookStatus.textContent = "✅ Book added successfully!";
            addBookStatus.className = "status success";
            addBookForm.reset();
        }
    });

    clearBookBtn.addEventListener("click", () => {
        addBookForm.reset();
        addBookStatus.textContent = "";
    });

    // Render All Syllabus
    function renderAllSyllabus() {
        const container = document.getElementById("allSyllabusContainer");
        const empty = document.getElementById("allSyllabusEmpty");
        container.innerHTML = "";

        if (syllabusList.length === 0) {
            empty.style.display = "block";
            return;
        }
        empty.style.display = "none";

        syllabusList.forEach((syl, idx) => {
            const card = createSyllabusCard(syl, idx + 1);
            container.appendChild(card);
        });
    }

    function createSyllabusCard(syl, num) {
        const card = document.createElement("div");
        card.className = "syllabus-card";

        let booksHtml = "";
        if (syl.books.length > 0) {
            booksHtml = `
                <div class="books-section">
                    <div class="books-title">📖 Reference Books (${syl.books.length})</div>
                    ${syl.books.map(b => `
                        <div class="book-item">
                            <div class="book-title">${escapeHtml(b.title)}</div>
                            <div class="book-author">by ${escapeHtml(b.author)}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        card.innerHTML = `
            <div class="syllabus-subject">${num}. ${escapeHtml(syl.subject)}</div>
            <div class="syllabus-units">${escapeHtml(syl.units)}</div>
            ${booksHtml}
        `;
        return card;
    }

    // Search by Subject
    const searchSubjectBtn = document.getElementById("searchSubjectBtn");
    const searchSubjectInput = document.getElementById("searchSubjectInput");
    const searchResults = document.getElementById("searchResults");
    const searchEmpty = document.getElementById("searchEmpty");

    searchSubjectBtn.addEventListener("click", () => {
        const query = searchSubjectInput.value.trim().toLowerCase();
        searchResults.innerHTML = "";

        if (!query) {
            searchEmpty.textContent = "Please enter a subject.";
            searchEmpty.style.display = "block";
            return;
        }

        const found = syllabusList.find(s => s.subject.toLowerCase() === query);

        if (!found) {
            searchEmpty.textContent = "No syllabus found for subject: " + query;
            searchEmpty.style.display = "block";
            return;
        }

        searchEmpty.style.display = "none";
        const card = createSyllabusCard(found, 1);
        searchResults.appendChild(card);
    });

    // View Books for Subject
    const viewBooksBtn = document.getElementById("viewBooksBtn");
    const booksSubjectInput = document.getElementById("booksSubjectInput");
    const booksResults = document.getElementById("booksResults");
    const booksEmpty = document.getElementById("booksEmpty");

    viewBooksBtn.addEventListener("click", () => {
        const query = booksSubjectInput.value.trim().toLowerCase();
        booksResults.innerHTML = "";

        if (!query) {
            booksEmpty.textContent = "Please enter a subject.";
            booksEmpty.style.display = "block";
            return;
        }

        const found = syllabusList.find(s => s.subject.toLowerCase() === query);

        if (!found || found.books.length === 0) {
            booksEmpty.textContent = "No books added for this subject.";
            booksEmpty.style.display = "block";
            return;
        }

        booksEmpty.style.display = "none";

        const card = document.createElement("div");
        card.className = "syllabus-card";
        card.innerHTML = `
            <div class="syllabus-subject">📖 Books for ${escapeHtml(found.subject)}</div>
            <div class="books-section">
                ${found.books.map((b, idx) => `
                    <div class="book-item">
                        <div class="book-title">${idx + 1}. ${escapeHtml(b.title)}</div>
                        <div class="book-author">Author: ${escapeHtml(b.author)}</div>
                    </div>
                `).join('')}
            </div>
        `;
        booksResults.appendChild(card);
    });

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
